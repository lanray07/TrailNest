name: App checks
on:
  push:
    branches: [main]
    paths: ['app/**', 'billing-server/**', 'tools/**', 'config/**', 'content/**', 'localisation/**', '*.gradle.kts', 'gradle/**', '.github/workflows/app-checks.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate translations and route provenance
        run: |
          node tools/localise.mjs --check --release
          node tools/editorial.mjs validate
      - name: Test receipt verification and tooling
        run: |
          node --test billing-server/tests/*.test.mjs
          node --test tools/tests/*.test.mjs
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4.156.0 deploy --config billing-server/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/trailnest-worker"
      - name: Install Android build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated draft and run Android JVM checks
        run: bash gradlew :app:testDebugUnitTest :app:assembleTranslationPreview :app:assembleTranslationPreviewAndroidTest :app:lintDebug -PtrailnestTestBuildType=translationPreview --max-workers=2 --console=plain
      - name: Explain acceptance scope
        run: echo 'These checks do not certify Fire-device/offline acceptance, live production billing or Amazon submission.' >> "$GITHUB_STEP_SUMMARY"
